name: Browser Worker Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'browser-worker/**'
      - 'compose.browser.yml'
      - '.github/workflows/browser-smoke.yml'
      - 'runtime/src/**'
      - 'runtime/migrations/**'
      - 'runtime/scripts/e2e-local.mjs'
      - 'runtime/test/fixtures/fake-ollama.mjs'
      - 'runtime/package.json'
      - 'runtime/package-lock.json'
      - 'scripts/backup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium Playwright noVNC local loopback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_WORKER_TOKEN: "ci-test-only-do-not-reuse-this-secret-0000000000000000"
      VNC_PASSWORD: "ci-demo1"
      RUNTIME_TOKEN: "ci-test-runtime-token-000000000000000000000000000"
      TEST_DATABASE_URL: postgres://paw_ci:ephemeral-test-only@127.0.0.1:5432/paw_ci
      DATABASE_URL: postgres://paw_ci:ephemeral-test-only@127.0.0.1:5432/paw_ci
      OLLAMA_URL: http://127.0.0.1:11434
      BROWSER_WORKER_URL: http://127.0.0.1:4300
      RUNTIME_HOST: "127.0.0.1"
      RUNTIME_PORT: "4100"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paw_ci
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: paw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paw_ci -d paw_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure throwaway local test credentials
        run: |
          {
            echo "BROWSER_WORKER_TOKEN=$BROWSER_WORKER_TOKEN"
            echo "VNC_PASSWORD=$VNC_PASSWORD"
            echo "BROWSER_AGENT_DOMAINS="
            echo "BROWSER_ENABLE_READONLY_AGENT=false"
            echo "BROWSER_CI_TRUSTED_SMOKE=true"
          } > browser-worker/.env
          chmod 600 browser-worker/.env
      - name: Build and launch real browser, VNC and noVNC
        run: docker compose -f compose.browser.yml up -d --build
      - name: Wait for actual browser readiness
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-browser-health.json; then
              if node -e 'const h = require("/tmp/paw-browser-health.json"); process.exit(h.ready && h.novnc && h.mode === "STOPPED" && h.viewOnly ? 0 : 1)'; then
                ready=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f compose.browser.yml logs --no-color --tail=100
            echo "Chromium/noVNC not ready" >&2
            exit 1
          fi
      - name: Check authentication, actual tabs and manual handoff
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4300/tabs)" = "401"
          curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/tabs > /tmp/paw-tabs.json
          node -e 'const tabs = require("/tmp/paw-tabs.json"); if (!Array.isArray(tabs) || !tabs.length) process.exit(1)'
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"MANUAL"}' http://127.0.0.1:4300/control > /tmp/paw-manual.json
          node -e 'const h = require("/tmp/paw-manual.json"); process.exit(h.mode === "MANUAL" && !h.viewOnly ? 0 : 1)'
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"STOPPED"}' http://127.0.0.1:4300/control > /tmp/paw-stopped.json
          node -e 'const h = require("/tmp/paw-stopped.json"); process.exit(h.mode === "STOPPED" && h.viewOnly ? 0 : 1)'
      - name: Configure integration Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime
        working-directory: runtime
        run: npm ci
      - name: Apply seven PostgreSQL schema migrations
        working-directory: runtime
        run: npm run migrate
      - name: Start disposable fake Ollama and real Fastify runtime
        run: |
          node runtime/test/fixtures/fake-ollama.mjs > /tmp/paw-fixture.log 2>&1 &
          echo $! > /tmp/paw-fixture.pid
          (cd runtime && npm run start) > /tmp/paw-runtime.log 2>&1 &
          echo $! > /tmp/paw-runtime.pid
      - name: Verify combined Fastify / PostgreSQL / Chromium / noVNC / fake Ollama
        run: node runtime/scripts/e2e-local.mjs
      - name: Verify disposable Chromium profile survives a container restart
        run: |
          curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-profile-before.json
          node -e 'const h = require("/tmp/paw-profile-before.json"); if (h.ciProfileRecovered !== false) process.exit(1)'
          docker compose -f compose.browser.yml restart -t 30 browser-worker
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-profile-after.json; then
              if node -e 'const h = require("/tmp/paw-profile-after.json"); process.exit(h.ciProfileRecovered === true && h.mode === "STOPPED" && h.viewOnly && h.ready && h.novnc ? 0 : 1)'; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Browser health and profile recovery diagnostics (synthetic CI only):" >&2
            if [ -f /tmp/paw-profile-after.json ]; then node -e 'const h=require("/tmp/paw-profile-after.json");console.error(JSON.stringify({ready:h.ready,novnc:h.novnc,mode:h.mode,viewOnly:h.viewOnly,ciProfileRecovered:h.ciProfileRecovered}))'; fi
            docker compose -f compose.browser.yml logs --no-color --tail=120
            echo "Profile cookie was not recovered safely after restart" >&2
            exit 1
          fi
      - name: Verify worker outage fails closed and recovery remains STOPPED
        run: |
          docker compose -f compose.browser.yml stop -t 30 browser-worker
          if curl --fail --silent --show-error --max-time 3 -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-should-be-offline.json 2>/dev/null; then
            echo "Worker endpoint remained reachable after container stop" >&2
            exit 1
          fi
          docker compose -f compose.browser.yml up -d --no-deps browser-worker
          recovered=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-recovered.json 2>/dev/null; then
              if node -e 'const h=require("/tmp/paw-recovered.json");process.exit(h.ready && h.novnc && h.mode==="STOPPED" && h.viewOnly && h.ciProfileRecovered===true ? 0 : 1)'; then
                recovered=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$recovered" -ne 1 ]; then
            echo "Worker did not recover in STOPPED view-only state with disposable profile preserved" >&2
            exit 1
          fi
          echo "PASS: offline worker is unreachable; restart never restores agent ownership"

      - name: Ollama fixture outage is reported and recovery is observable
        run: |
          kill "$(cat /tmp/paw-fixture.pid)"
          unavailable=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/health > /tmp/paw-ollama-down.json; then
              if node -e 'const h=require("/tmp/paw-ollama-down.json");process.exit(h.services?.some(s=>s.name==="ollama" && s.status!=="up")?0:1)'; then
                unavailable=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$unavailable" -ne 1 ]; then echo "Ollama outage not reported" >&2; exit 1; fi
          node runtime/test/fixtures/fake-ollama.mjs > /tmp/paw-fixture.log 2>&1 &
          echo $! > /tmp/paw-fixture.pid
          recovered=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/health > /tmp/paw-ollama-up.json; then
              if node -e 'const h=require("/tmp/paw-ollama-up.json");process.exit(h.services?.some(s=>s.name==="ollama" && s.status==="up")?0:1)'; then
                recovered=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$recovered" -ne 1 ]; then echo "Ollama service recovery not reflected" >&2; exit 1; fi
          echo "PASS: model-service loss and recovery reflected by real Fastify health"

      - name: PostgreSQL outage and recovery are reflected without resuming agent
        run: |
          db="$(docker ps -q --filter ancestor=postgres:16-alpine | head -1)"
          test -n "$db" || { echo "Disposable PostgreSQL container unavailable" >&2; exit 1; }
          docker stop "$db"
          # The service container is managed by Actions, not compose; fail if health stays UP.
          unavailable=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/health > /tmp/paw-db-down.json 2>/dev/null; then
              if node -e 'const h=require("/tmp/paw-db-down.json");process.exit(h.services?.some(s=>s.name==="postgres" && s.status!=="up")?0:1)'; then unavailable=1; break; fi
            fi
            sleep 1
          done
          test "$unavailable" -eq 1 || { echo "DB outage not detected" >&2; exit 1; }
          test -n "$db"
          docker start "$db"
          recovered=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/health > /tmp/paw-db-up.json 2>/dev/null; then
              if node -e 'const h=require("/tmp/paw-db-up.json");process.exit(h.services?.some(s=>s.name==="postgres" && s.status==="up")?0:1)'; then recovered=1; break; fi
            fi
            sleep 2
          done
          test "$recovered" -eq 1 || { echo "DB recovery not detected" >&2; exit 1; }
          curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-browser-after-db.json
          node -e 'const h=require("/tmp/paw-browser-after-db.json");process.exit(h.mode==="STOPPED" && h.viewOnly ? 0 : 1)'
          curl -fsS --max-time 5 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/agent/status > /tmp/paw-control-after-db.json
          node -e 'const s=require("/tmp/paw-control-after-db.json");const v=s.control ?? s.snapshot?.state;if(!["MANUAL","STOPPED"].includes(v)){console.error("Unexpected control after database recovery");process.exit(1)}'
          curl -fsS --max-time 5 -H "Authorization: Bearer $RUNTIME_TOKEN" http://127.0.0.1:4100/v1/browser/tabs > /tmp/paw-tabs-after-db.json
          node -e 'const t=require("/tmp/paw-tabs-after-db.json");if(!Array.isArray(t)||t.length<1)process.exit(1)'
          echo "PASS: database health recovers without granting agent control"

      - name: Refuse maintenance lock during manual ownership
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"MANUAL"}' http://127.0.0.1:4300/control > /tmp/paw-maint-manual.json
          node -e 'const h=require("/tmp/paw-maint-manual.json");process.exit(h.mode==="MANUAL" && h.viewOnly===false?0:1)'
          code="$(curl -sS -o /tmp/paw-maint-refused.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{}' http://127.0.0.1:4300/maintenance/lock)"
          test "$code" = "409"
          node -e 'const h=require("/tmp/paw-maint-refused.json");process.exit(h.error==="maintenance_requires_stopped"?0:1)'
          curl -fsS -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-maint-still-manual.json
          node -e 'const h=require("/tmp/paw-maint-still-manual.json");process.exit(h.mode==="MANUAL" && h.viewOnly===false?0:1)'
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"STOPPED"}' http://127.0.0.1:4300/control > /tmp/paw-maint-stopped.json
          node -e 'const h=require("/tmp/paw-maint-stopped.json");process.exit(h.mode==="STOPPED" && h.viewOnly===true?0:1)'
      - name: Maintenance lock rejects handoff until fresh worker restart
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{}' http://127.0.0.1:4300/maintenance/lock > /tmp/paw-maintenance-lock.json
          node -e 'const h=require("/tmp/paw-maintenance-lock.json");process.exit(h.maintenanceLocked && h.mode==="STOPPED" && h.viewOnly ? 0 : 1)'
          curl -fsS -X POST -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{}' http://127.0.0.1:4300/maintenance/lock > /tmp/paw-maintenance-lock-again.json
          node -e 'const h=require("/tmp/paw-maintenance-lock-again.json");process.exit(h.maintenanceLocked && h.mode==="STOPPED" && h.viewOnly ? 0 : 1)'
          status="$(curl -sS -o /tmp/paw-maintenance-denied.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"MANUAL"}' http://127.0.0.1:4300/control)"
          test "$status" = "409"
          node -e 'const h=require("/tmp/paw-maintenance-denied.json");process.exit(h.error==="maintenance_locked"?0:1)'
          tab_status="$(curl -sS -o /tmp/paw-maintenance-tab-denied.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d '{}' http://127.0.0.1:4300/tabs/new)"
          test "$tab_status" = "409"
          node -e 'const h=require("/tmp/paw-maintenance-tab-denied.json");process.exit(h.error==="maintenance_locked"?0:1)'
          docker compose -f compose.browser.yml restart -t 30 browser-worker
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 -H "Authorization: Bearer $BROWSER_WORKER_TOKEN" http://127.0.0.1:4300/health > /tmp/paw-maintenance-recovered.json 2>/dev/null; then
              if node -e 'const h=require("/tmp/paw-maintenance-recovered.json");process.exit(h.mode==="STOPPED" && h.viewOnly && h.ready && h.novnc && h.ciProfileRecovered===true ? 0 : 1)'; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "Browser recovery after maintenance lock failed" >&2; exit 1; }
          echo "PASS: maintenance lock blocked ownership handoff; fresh worker recovered STOPPED"

      - name: Refuse copying active Chromium profile then encrypt stopped profile
        run: |
          pass='Temporary CI Chromium passphrase - no real cookies 2026'
          if printf '%s\n' "$pass" | node scripts/backup/browser-profile.mjs backup --output /tmp/should-never-exist.pawprofile; then
            echo "Security failure: profile backup allowed a running browser" >&2
            exit 1
          fi
          test ! -e /tmp/should-never-exist.pawprofile
          docker compose -f compose.browser.yml stop browser-worker
          printf '%s\n' "$pass" | node scripts/backup/browser-profile.mjs backup --output /tmp/ci-chromium.pawprofile
          printf '%s\n' "$pass" | node scripts/backup/browser-profile.mjs verify --input /tmp/ci-chromium.pawprofile
          if printf '%s\n' 'A totally different CI passphrase!' | \
            node scripts/backup/browser-profile.mjs verify --input /tmp/ci-chromium.pawprofile; then
            echo "Wrong-password Chromium profile validation unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Restore Chromium data to separate never-attached Docker volume
        run: |
          pass='Temporary CI Chromium passphrase - no real cookies 2026'
          printf '%s\n' "$pass" | \
            node scripts/backup/browser-profile.mjs restore --input /tmp/ci-chromium.pawprofile > /tmp/ci-profile-restore.log
          volume="$(sed -n 's/^Restored into NEW UNATTACHED Docker volume: //p' /tmp/ci-profile-restore.log)"
          if [ -z "$volume" ]; then echo "Missing restored volume" >&2; exit 1; fi
          echo "$volume" > /tmp/ci-restored-volume.txt
          docker run --rm --network none --read-only --cap-drop ALL \
            --mount "type=volume,source=$volume,target=/profile,readonly" \
            alpine:3.20 test -d /profile/default
          source_volume="$(docker inspect "$(docker compose -f compose.browser.yml ps -a -q browser-worker)" \
            --format '{{range .Mounts}}{{if eq .Destination "/home/pwuser/browser-data"}}{{.Name}}{{end}}{{end}}')"
          test "$source_volume" != "$volume"
          echo 'PASS: encrypted Chromium snapshot verified and restored to an unlinked new Docker volume'
      - name: Browser diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.browser.yml logs --no-color --tail=160 || true
          tail -n 100 /tmp/paw-runtime.log || true
          tail -n 50 /tmp/paw-fixture.log || true
      - name: Tear down throwaway browser and profile
        if: always()
        run: |
          docker compose -f compose.browser.yml down -v || true
          rm -f browser-worker/.env /tmp/ci-chromium.pawprofile
          if [ -f /tmp/ci-restored-volume.txt ]; then
            docker volume rm "$(cat /tmp/ci-restored-volume.txt)" || true
          fi
          for file in /tmp/paw-runtime.pid /tmp/paw-fixture.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" || true; fi
          done
