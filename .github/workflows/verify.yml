name: Verify Cloud Development

# Validate updates to the public repository automatically.
# Hosted runner availability depends on GitHub Actions settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Arabic UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies from Bun lockfile
        run: bun install --frozen-lockfile
      - name: Frontend tests
        run: bun run test
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Frontend production build
        run: bun run build
        env:
          VITE_MOCK_MODE: "true"

  runtime:
    name: Local-runtime static and mock-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests (without local browser/real PostgreSQL)
        run: npm test

  browser-policy:
    name: Chromium worker policy (no browser needed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check worker syntax
        run: node --check src/server.mjs && node --check src/policy.mjs
      - name: Test agent domain and ownership policies
        run: npm test

  postgres-integration:
    name: PostgreSQL migrations and real database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paw_test
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: paw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paw_test -d paw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: runtime
    env:
      TEST_DATABASE_URL: postgres://paw_test:ci-ephemeral-only@127.0.0.1:5432/paw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies
        run: npm ci
      - name: Run schema migrations against disposable PostgreSQL
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
      - name: Execute real database and other runtime tests sequentially
        run: npm test -- --maxWorkers=1 --minWorkers=1
  
  windows-script-static:
    name: Windows PowerShell and Docker Compose syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse local Windows scripts without executing them
        shell: pwsh
        run: |
          $paths = @("scripts/windows/launch.ps1", "scripts/windows/setup.ps1", "scripts/windows/start.ps1", "scripts/windows/diagnose.ps1", "scripts/windows/backup.ps1", "scripts/windows/restore.ps1", "scripts/windows/scheduled-backup.ps1", "scripts/windows/browser-profile.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $path"
            }
            Write-Host "Valid syntax: $path"
          }
      - name: Validate local database Compose config with throwaway env
        run: |
          mkdir -p local
          echo "POSTGRES_PASSWORD=ci-only-compose-parser" > local/.env
          docker compose --env-file local/.env -f compose.database.yml config --quiet
          rm -f local/.env

  encrypted-backup-roundtrip:
    name: Encrypted PostgreSQL backup and non-destructive restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Test portable encryption, tamper detection and password failures
        run: node --test scripts/backup/crypto.test.mjs
      - name: Start isolated local PostgreSQL container
        run: |
          mkdir -p local
          echo 'POSTGRES_PASSWORD=ci-throwaway-db' > local/.env
          docker compose --env-file local/.env -f compose.database.yml up -d
          for i in $(seq 1 40); do
            if docker compose --env-file local/.env -f compose.database.yml exec -T database pg_isready -U paw -d paw; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply migrations and create harmless canary data
        run: |
          cd runtime
          npm ci
          DATABASE_URL=postgres://paw:ci-throwaway-db@127.0.0.1:5432/paw npm run migrate
          cd ..
          docker compose --env-file local/.env -f compose.database.yml exec -T database \
            psql -U paw -d paw -v ON_ERROR_STOP=1 -c \
            "INSERT INTO knowledge_items(id,category,title,body,tags) VALUES('11111111-2222-4333-8444-555555555555','style','CI test','ci-private-canary',ARRAY['test']);"
      - name: Create encrypted backup and restore into a fresh database
        run: |
          printf '%s\n' 'CI test passphrase is not a real user secret 2026!' | \
            node scripts/backup/db-backup.mjs backup --output /tmp/paw-test.pawbak
          printf '%s\n' 'CI test passphrase is not a real user secret 2026!' | \
            node scripts/backup/db-backup.mjs verify --input /tmp/paw-test.pawbak
          if printf '%s\n' 'Wrong passphrase for CI testing 2026!' | \
            node scripts/backup/db-backup.mjs verify --input /tmp/paw-test.pawbak; then
            echo 'Wrong-password integrity verification unexpectedly passed' >&2
            exit 1
          fi
          if printf '%s\n' 'Wrong passphrase for CI testing 2026!' | \
            node scripts/backup/db-backup.mjs restore --input /tmp/paw-test.pawbak --database paw_restore_ci_wrong; then
            echo 'Wrong password unexpectedly worked' >&2
            exit 1
          fi
          printf '%s\n' 'CI test passphrase is not a real user secret 2026!' | \
            node scripts/backup/db-backup.mjs restore --input /tmp/paw-test.pawbak --database paw_restore_ci_valid
          restored="$(docker compose --env-file local/.env -f compose.database.yml exec -T database \
            psql -U paw -d paw_restore_ci_valid -At -c \
            "SELECT body FROM knowledge_items WHERE id='11111111-2222-4333-8444-555555555555'")"
          test "$restored" = "ci-private-canary"
          original="$(docker compose --env-file local/.env -f compose.database.yml exec -T database \
            psql -U paw -d paw -At -c \
            "SELECT body FROM knowledge_items WHERE id='11111111-2222-4333-8444-555555555555'")"
          test "$original" = "ci-private-canary"
          wrong_db="$(docker compose --env-file local/.env -f compose.database.yml exec -T database \
            psql -U paw -d postgres -At -c "SELECT 1 FROM pg_database WHERE datname='paw_restore_ci_wrong'")"
          test -z "$wrong_db"
          echo 'PASS: authenticated backup, wrong password refusal, isolated restore, canary match, original untouched'
      - name: Destroy throwaway backups and DB only
        if: always()
        run: |
          docker compose --env-file local/.env -f compose.database.yml down -v || true
          rm -f /tmp/paw-test.pawbak local/.env

  windows-dpapi-selftest:
    name: Windows DPAPI owner-scoped scheduled backup self-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run owner-scoped DPAPI round-trip WITHOUT registering any scheduled task
        shell: powershell
        run: |
          .\scripts\windows\scheduled-backup.ps1 -SelfTest
