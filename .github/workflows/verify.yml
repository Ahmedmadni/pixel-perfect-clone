name: Verify Cloud Development

# Validate updates to the public repository automatically.
# Hosted runner availability depends on GitHub Actions settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Arabic UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies from Bun lockfile
        run: bun install --frozen-lockfile
      - name: Frontend tests
        run: bun run test
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Frontend production build
        run: bun run build
        env:
          VITE_MOCK_MODE: "true"

  runtime:
    name: Local-runtime static and mock-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests (without local browser/real PostgreSQL)
        run: npm test

  browser-policy:
    name: Chromium worker policy (no browser needed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check worker syntax
        run: node --check src/server.mjs && node --check src/policy.mjs
      - name: Test agent domain and ownership policies
        run: npm test

  postgres-integration:
    name: PostgreSQL migrations and real database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paw_test
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: paw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paw_test -d paw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: runtime
    env:
      TEST_DATABASE_URL: postgres://paw_test:ci-ephemeral-only@127.0.0.1:5432/paw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies
        run: npm ci
      - name: Run schema migrations against disposable PostgreSQL
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
      - name: Execute real database and other runtime tests sequentially
        run: npm test -- --maxWorkers=1 --minWorkers=1
  
  windows-script-static:
    name: Windows PowerShell and Docker Compose syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse local Windows scripts without executing them
        shell: pwsh
        run: |
          $paths = @("scripts/windows/setup.ps1", "scripts/windows/start.ps1", "scripts/windows/diagnose.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $path"
            }
            Write-Host "Valid syntax: $path"
          }
      - name: Validate local database Compose config with throwaway env
        run: |
          mkdir -p local
          echo "POSTGRES_PASSWORD=ci-only-compose-parser" > local/.env
          docker compose --env-file local/.env -f compose.database.yml config --quiet
          rm -f local/.env
